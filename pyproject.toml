[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chonkie>=1.7.0",
    "docling>=2.126.0",
    "docling-core[chunking]>=2.96.0",
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "openai>=3.19.2",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "transformers>=5.17.0",
    "uvicorn>=0.52.4",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
